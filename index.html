<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080e21"><title>Entrelia — Powered by Atlas</title><meta name="description" content="Entrelia: un universo digitale sta prendendo forma. Powered by Atlas."><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;color:#f5f6ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(ellipse at 25% 20%,#273b78 0%,transparent 42%),radial-gradient(ellipse at 85% 80%,#35205a 0%,transparent 45%),#080e21}main{text-align:center;padding:3rem 1.5rem;max-width:780px}h1{font-size:clamp(3.8rem,12vw,7rem);letter-spacing:.14em;font-weight:650;margin:0}p{font-size:clamp(1.15rem,3vw,1.6rem);line-height:1.6;color:#d8dff8}.sub{font-size:.9rem;letter-spacing:.35em;text-transform:uppercase;color:#aebef5}.star{font-size:2rem;color:#a8b9ff;margin-bottom:1.5rem}footer{margin-top:4rem;color:#9daacf;font-size:.85rem}.action{display:inline-flex;align-items:center;justify-content:center;margin-top:1.6rem;padding:.85rem 1.6rem;border:1px solid #8da7ff;border-radius:12px;background:#192a57;color:#f5f6ff;font:inherit;font-weight:650;letter-spacing:.06em;cursor:pointer;transition:background .2s,transform .2s}.action:hover{background:#304581;transform:translateY(-2px)}.action:focus-visible{outline:3px solid #d7e4ff;outline-offset:4px}[hidden]{display:none!important}.panel{margin-top:2.5rem;padding:2rem;border:1px solid #596ca5;border-radius:20px;background:#111b3bbb}.panel h2{font-size:clamp(1.6rem,5vw,2.4rem);margin:.4rem 0}.panel p{font-size:1rem}.module{display:block;width:100%;padding:1.25rem;margin-top:1.4rem;text-align:left;border-radius:14px;border:1px solid #7184bf;background:#1a2850;color:inherit;font:inherit;cursor:pointer}.module:hover{background:#253867}.module strong{display:block;font-size:1.25rem}.module span{display:block;font-size:.9rem;color:#c0cae8;margin-top:.5rem}.match-list{display:grid;gap:1rem;margin-top:1.5rem}.match{padding:1rem;text-align:left;border-radius:12px;border:1px solid #7184bf;background:#182345}.match strong{display:block;font-size:1.15rem}.match span{display:block;margin-top:.35rem;color:#cbd4fa;font-size:.95rem}.result-win{color:#8ee4c9}.result-loss{color:#ffa7b1}.status{font-size:1rem!important;color:#ccd7f5!important}.back{margin-top:1.4rem;border:0;background:transparent;color:#b8caff;text-decoration:underline;cursor:pointer;font:inherit} .stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem;margin-top:.8rem}.stat{padding:.6rem;border:1px solid #455a92;border-radius:9px;background:#101a37}.stat small{display:block;color:#aebce3;font-size:.76rem}.stat b{display:block;margin-top:.18rem;font-size:1rem}.match details{margin-top:1rem}.match summary{cursor:pointer;color:#b9caff}.damage-breakdown{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin-top:.9rem}.pie{flex:0 0 110px;width:110px;height:110px;border-radius:50%;border:2px solid #8da7ff}.legend{font-size:.85rem;line-height:1.8;color:#d8dff8}.dot{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;margin-right:.35rem}.summary-stats{margin:1.1rem 0;padding:1rem;border:1px solid #596ca5;border-radius:12px;background:#152044}.summary-stats strong{display:block}.summary-stats span{display:block;margin-top:.4rem;color:#cbd4fa;font-size:.9rem}@media(max-width:480px){.panel{padding:1rem}.stats-grid{grid-template-columns:1fr 1fr}.damage-breakdown{justify-content:center}} .damage-report{margin-top:1rem}.damage-report h3{font-size:1.05rem;margin:0 0 .8rem}.damage-group{padding:.8rem;margin:.7rem 0;border:1px solid #435883;border-radius:12px;background:#101a34}.damage-group h4{font-size:.92rem;color:#d6def9;margin:0 0 .65rem}.damage-graph{display:flex;align-items:center;gap:1rem}.damage-bars{flex:1;min-width:0}.damage-row{margin:.35rem 0}.damage-row-label{display:flex;justify-content:space-between;gap:1rem;font-size:.82rem;color:#cbd4fa}.damage-track{height:7px;background:#303b5c;border-radius:6px;margin-top:.2rem;overflow:hidden}.damage-fill{height:100%;border-radius:6px}@media(max-width:480px){.damage-graph{flex-direction:column;align-items:stretch}.damage-graph .pie{align-self:center}.damage-bars{width:100%}} .team-compare{margin-top:1rem;border-top:1px solid #455a92;padding-top:1rem}.team-compare h3{margin:.2rem 0 .7rem;font-size:1rem}.compare-controls{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.7rem}.compare-controls button{background:#111c3a;border:1px solid #6379ab;border-radius:7px;color:#e3ebff;padding:.42rem .66rem;cursor:pointer}.compare-controls button[aria-pressed="true"]{background:#38558d;border-color:#b0c9ff}.teams{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}.team{min-width:0;padding:.6rem;border:1px solid #485d90;border-radius:10px;background:#0e1932}.team h4{margin:0 0 .7rem}.player-row{display:block;width:100%;text-align:left;color:#f2f5ff;background:#172442;border:1px solid transparent;border-radius:8px;margin:.4rem 0;padding:.55rem;cursor:pointer}.player-row[aria-pressed="true"]{border-color:#a8e8d3;background:#224455}.player-line{display:block;font-size:.84rem}.player-identity{display:block;overflow-wrap:anywhere;line-height:1.4}.player-value{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;margin-top:.4rem;color:#dce6ff;font-size:.82rem}.player-value b{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.player-value-label{color:#b9c8e9}.player-meta{display:block;color:#b9c8e9;font-size:.76rem;margin-top:.15rem}.player-meter{height:7px;background:#374467;border-radius:9px;margin-top:.35rem;overflow:hidden}.player-meter i{display:block;height:100%;background:#87b3ff}.player-row[aria-pressed="true"] .player-meter i{background:#8ee4c9}.selection-detail{margin-top:.7rem;padding:.7rem;border:1px solid #4b639a;border-radius:9px;background:#141f3b;font-size:.84rem;line-height:1.6}.rank-note{color:#b5c5e8;font-size:.76rem;margin:.5rem 0}.rank-label{color:#a7ebd2}@media(max-width:580px){.teams{grid-template-columns:1fr}}</style></head><body><main><div class="star" aria-hidden="true">✦</div><h1>ENTRELIA</h1><div class="sub">Powered by Atlas</div><p>Un universo digitale sta prendendo forma.</p><section id="welcome"><button class="action" id="enter" type="button">Enter Entrelia →</button></section><section id="hub" class="panel" hidden><h2>Esplora Entrelia</h2><p>Il nostro universo prende forma, un modulo alla volta.</p><button id="analyst" class="module" type="button"><strong>LoL Analyst →</strong><span>Uno spazio dedicato all'analisi delle partite di League of Legends.</span></button><button class="back" id="home-from-hub" type="button">← Torna alla pagina iniziale</button></section><section id="analyst-view" class="panel" hidden><h2>LoL Analyst</h2><p>Le ultime 10 partite reali di <strong>daxs#EUW</strong>.</p><p id="lol-status" class="status" role="status" aria-live="polite">Apri il modulo per caricare le partite.</p><div id="lol-summary" class="summary-stats" hidden></div><div id="lol-matches" class="match-list" aria-live="polite"></div><button type="button" class="action" id="lol-refresh">Aggiorna partite ↻</button><button class="back" id="back-to-hub" type="button">← Torna ai moduli</button></section><footer>Coming soon</footer></main><script>const welcome=document.getElementById('welcome'),hub=document.getElementById('hub'),analystView=document.getElementById('analyst-view');function show(view){welcome.hidden=view!=='welcome';hub.hidden=view!=='hub';analystView.hidden=view!=='analyst';}document.getElementById('enter').addEventListener('click',()=>show('hub'));document.getElementById('analyst').addEventListener('click',()=>{show('analyst');loadMatches()});document.getElementById('home-from-hub').addEventListener('click',()=>show('welcome'));document.getElementById('back-to-hub').addEventListener('click',()=>show('hub'));const status=document.getElementById('lol-status'),matches=document.getElementById('lol-matches'),summary=document.getElementById('lol-summary');
const fmt=v=>Number.isFinite(v)?v.toLocaleString('it-IT'):'—';
function stat(label,value){const box=document.createElement('div');box.className='stat';const a=document.createElement('small');a.textContent=label;const b=document.createElement('b');b.textContent=value;box.append(a,b);return box;}
function damageChart(m){
 const vals=[m.physicalDamage,m.magicDamage,m.trueDamage].map(v=>Number.isFinite(v)?Math.max(v,0):0),sum=vals.reduce((a,b)=>a+b,0);
 const wrap=document.createElement('div');wrap.className='damage-breakdown';
 if(!sum){wrap.textContent='Ripartizione danni non disponibile';return wrap;}
 const colors=['#8da7ff','#bd8dff','#8ee4c9'],labels=['Fisico','Magico','Puro'];let start=0;
 const stops=vals.map((v,i)=>{const end=start+v/sum*100,t=colors[i]+' '+start+'% '+end+'%';start=end;return t;});
 const pie=document.createElement('div');pie.className='pie';pie.style.background='conic-gradient('+stops.join(',')+')';pie.setAttribute('role','img');pie.setAttribute('aria-label','Ripartizione dei danni ai campioni');
 const legend=document.createElement('div');legend.className='legend';
 vals.forEach((v,i)=>{const row=document.createElement('div'),dot=document.createElement('i');dot.className='dot';dot.style.background=colors[i];row.append(dot,document.createTextNode(labels[i]+': '+fmt(v)+' ('+Math.round(v/sum*100)+'%)'));legend.append(row)});
 wrap.append(pie,legend);return wrap;
}
function detailedDamage(m){
 const section=document.createElement('section');section.className='damage-report';
 const heading=document.createElement('h3');heading.textContent='Danni · dettagli della partita';section.append(heading);
 const groups=[
 ['Danni ai campioni',[
 ['Fisici',m.physicalDamage],['Magici',m.magicDamage],['Puri',m.trueDamage]]],
 ['Danni subiti',[
 ['Fisici',m.physicalDamageTaken],['Magici',m.magicDamageTaken],['Puri',m.trueDamageTaken]]],
 ['Danni inflitti complessivi',[
 ['Fisici',m.totalPhysicalDamageDealt],['Magici',m.totalMagicDamageDealt],['Puri',m.totalTrueDamageDealt]]]
 ];
 const palette=['#8da7ff','#bd8dff','#8ee4c9'];
 for(const [title,parts] of groups){
  const box=document.createElement('div');box.className='damage-group';
  const label=document.createElement('h4');label.textContent=title;box.append(label);
  const numbers=parts.map(([,v])=>Number.isFinite(v)?Math.max(0,v):0);
  const total=numbers.reduce((a,b)=>a+b,0);
  const graph=document.createElement('div');graph.className='damage-graph';
  if(total>0){
   const pie=document.createElement('div');pie.className='pie';let cur=0;
   pie.style.background='conic-gradient('+numbers.map((v,i)=>{const start=cur;cur+=v/total*100;return palette[i]+' '+start+'% '+cur+'%'}).join(',')+')';
   pie.setAttribute('role','img');pie.setAttribute('aria-label',title+': '+parts.map(([n,v])=>n+' '+fmt(v)).join(', '));
   graph.append(pie);
  }
  const bars=document.createElement('div');bars.className='damage-bars';
  parts.forEach(([name,value],i)=>{
   const row=document.createElement('div');row.className='damage-row';
   const top=document.createElement('div');top.className='damage-row-label';
   const nameEl=document.createElement('span');nameEl.textContent=name;
   const valEl=document.createElement('b');valEl.textContent=fmt(value);
   top.append(nameEl,valEl);
   const track=document.createElement('div');track.className='damage-track';
   const fill=document.createElement('div');fill.className='damage-fill';fill.style.background=palette[i];
   fill.style.width=(total?numbers[i]/total*100:0)+'%';track.append(fill);row.append(top,track);bars.append(row);
  });
  graph.append(bars);box.append(graph);section.append(box);
 }
 const totals=document.createElement('div');totals.className='stats-grid';
 [['Totale ai campioni',m.damageDealt],['Totale inflitto',m.totalDamageDealt],['Totale subito',m.damageTaken],['Danni mitigati',m.damageSelfMitigated],['Cure totali',m.healing],['Cure agli alleati',m.totalHealsOnTeammates],['Scudi agli alleati',m.shielding],['Danni alle torri',m.turretDamage],['Danni agli obiettivi',m.objectiveDamage]].forEach(([name,value])=>totals.append(stat(name,fmt(value))));
 section.append(totals);return section;
}
async function loadMatches(){
 status.textContent='Caricamento partite reali da Riot…';matches.replaceChildren();summary.hidden=true;summary.replaceChildren();
 try{
  const response=await fetch('/api/lol/latest',{headers:{Accept:'application/json'}});
  const data=await response.json();
  if(!response.ok||data.status!=='ok'){status.textContent=data.message||'Servizio Riot temporaneamente non disponibile.';return;}
  if(!data.matches?.length){status.textContent='Nessuna partita recente trovata.';return;}
  status.textContent='Partite recuperate da Riot.';
  const played=data.matches.length,wins=data.matches.filter(m=>m.win).length;
  const title=document.createElement('strong');title.textContent='Riepilogo ultime '+played+' partite';
  const line=document.createElement('span');line.textContent='Vittorie: '+wins+' · Sconfitte: '+(played-wins)+' · Win rate: '+Math.round(wins/played*100)+'%';
  summary.append(title,line);summary.hidden=false;
  for(const match of data.matches){
   const article=document.createElement('article');article.className='match';
   const heading=document.createElement('strong');heading.textContent=(match.win?'Vittoria · ':'Sconfitta · ')+(match.champion||'Campione sconosciuto');heading.className=match.win?'result-win':'result-loss';
   const kda=document.createElement('span');kda.textContent='KDA: '+match.kills+' / '+match.deaths+' / '+match.assists;
   const detail=document.createElement('span');const started=match.startedAt?new Date(match.startedAt).toLocaleString('it-IT'):'';detail.textContent=[match.mode||'',started].filter(Boolean).join(' · ');
   const damage=document.createElement('span');
   const dealt=Number.isFinite(match.damageDealt)?match.damageDealt.toLocaleString('it-IT'):'—';
   const taken=Number.isFinite(match.damageTaken)?match.damageTaken.toLocaleString('it-IT'):'—';
   damage.textContent='Danni ai campioni: '+dealt+' · Danni subiti: '+taken;
   article.append(heading,kda,damage,detail);
   const comparison=match.participants?.length===10?matchComparison(match):null;if(comparison)article.append(comparison);
   const expand=document.createElement('details'),label=document.createElement('summary');label.textContent='Statistiche complete della partita';
   const grid=document.createElement('div');grid.className='stats-grid';
   const entries=[['Durata',Number.isFinite(match.durationSeconds)?Math.round(match.durationSeconds/60)+' min':'—'],['Ruolo',match.position||'—'],['Livello',fmt(match.level)],['Oro',fmt(match.gold)],['CS',fmt(match.cs)],['Vision score',fmt(match.vision)],['Ward piazzate',fmt(match.wardsPlaced)],['Ward distrutte',fmt(match.wardsKilled)],['Cure',fmt(match.healing)],['Scudi agli alleati',fmt(match.shielding)],['CC inflitto',Number.isFinite(match.ccSeconds)?fmt(match.ccSeconds)+' s':'—'],['Danni alle torri',fmt(match.turretDamage)],['Danni agli obiettivi',fmt(match.objectiveDamage)]];
   entries.forEach(([name,value])=>grid.append(stat(name,value)));
   expand.append(label,detailedDamage(match),grid);
   if(Array.isArray(match.items)){const items=document.createElement('span');items.textContent='ID oggetti: '+match.items.filter(v=>Number.isInteger(v)&&v>0).join(' · ');expand.append(items);}
   article.append(expand);matches.append(article);
   if(match===data.matches[0])comparison?.querySelector('.rank-load')?.click();
  }
 }catch(e){status.textContent='Non riesco a contattare il servizio Riot in questo momento.';}
}
const comparisonMetrics=[
 ["damageDealt","Danni ai campioni"],["damageTaken","Danni subiti"],
 ["gold","Oro"],["cs","Farm"],["vision","Visione"],
 ["healing","Cure"],["shielding","Scudi"],
 ["turretDamage","Danni torri"],["objectiveDamage","Danni obiettivi"]
];
const rankCache=new Map();
function matchComparison(match){
 const section=document.createElement('section');section.className='team-compare';
 const title=document.createElement('h3');title.textContent='Osservatorio · tutti i 10 giocatori';
 const controls=document.createElement('div');controls.className='compare-controls';
 const teams=document.createElement('div');teams.className='teams';
 const detail=document.createElement('div');detail.className='selection-detail';
 const note=document.createElement('p');note.className='rank-note';note.textContent='Rank Solo/Duo attuale, non storico. Apri il confronto per caricarlo.';
 let metric='damageDealt',selected=match.puuid,ranks=null;
 const buttons=new Map();
 comparisonMetrics.forEach(([key,label])=>{
  const button=document.createElement('button');button.type='button';button.textContent=label;
  button.addEventListener('click',()=>{metric=key;render()});controls.append(button);buttons.set(key,button);
 });
 function rankOf(player){
  if(!ranks)return 'Rank da caricare';
  const r=ranks[player.puuid];
  return r?r.tier+' '+r.division+' · '+r.lp+' LP':'Non classificato / non disponibile';
 }
 function render(){
  buttons.forEach((b,key)=>b.setAttribute('aria-pressed',String(metric===key)));
  teams.replaceChildren();
  const max=Math.max(1,...match.participants.map(p=>Number(p[metric])||0));
  for(const id of [100,200]){
   const team=document.createElement('div');team.className='team';
   const label=document.createElement('h4');label.textContent='Squadra '+(id===100?'blu':'rossa');team.append(label);
   match.participants.filter(p=>p.teamId===id).forEach(p=>{
    const row=document.createElement('button');row.type='button';row.className='player-row';
    row.setAttribute('aria-pressed',String(selected===p.puuid));
    const top=document.createElement('span');top.className='player-line';
    const name=document.createElement('b');name.className='player-identity';
    name.textContent=p.champion+' · '+p.name+(p.tag?'#'+p.tag:'');top.append(name);
    const subtitle=document.createElement('span');subtitle.className='player-meta';
    subtitle.textContent='KDA '+p.kills+'/'+p.deaths+'/'+p.assists+' · '+rankOf(p);
    const metricRow=document.createElement('span');metricRow.className='player-value';
    const metricName=document.createElement('span');metricName.className='player-value-label';
    metricName.textContent=comparisonMetrics.find(([key])=>key===metric)?.[1]||metric;
    const value=document.createElement('b');value.textContent=fmt(p[metric]);
    metricRow.append(metricName,value);
    const meter=document.createElement('span');meter.className='player-meter';
    const fill=document.createElement('i');fill.style.width=Math.max(0,Math.min(100,(Number(p[metric])||0)/max*100))+'%';
    meter.append(fill);row.append(top,subtitle,metricRow,meter);
    row.addEventListener('click',()=>{selected=p.puuid;render()});team.append(row);
   });teams.append(team);
  }
  const player=match.participants.find(p=>p.puuid===selected)||match.participants[0];
  detail.textContent=player.champion+' · '+player.name+' · '+rankOf(player)+' · Danni '+fmt(player.damageDealt)+' · Subiti '+fmt(player.damageTaken)+' · Oro '+fmt(player.gold)+' · CS '+fmt(player.cs)+' · Visione '+fmt(player.vision)+' · Obiettivi '+fmt(player.objectiveDamage);
 }
 const open=document.createElement('button');open.type='button';open.className='back rank-load';open.textContent='Carica i rank attuali ↻';
 open.addEventListener('click',async()=>{
  if(rankCache.has(match.id)){ranks=rankCache.get(match.id);note.textContent='Rank Solo/Duo attuali · non riferiti alla data della partita.';render();return;}
  open.disabled=true;note.textContent='Recupero rank attuali…';
  try{
   const response=await fetch('/api/lol/ranks?match='+encodeURIComponent(match.id),{headers:{Accept:'application/json'}});
   const data=await response.json();
   if(!response.ok||data.status!=='ok')throw Error(data.message||'Rank non disponibili');
   ranks=data.ranks;rankCache.set(match.id,ranks);
   note.textContent='Rank Solo/Duo attuali · non riferiti alla data della partita.';render();
  }catch(error){note.textContent=error.message||'Rank non disponibili';}
  finally{open.disabled=false;}
 });
 section.append(title,controls,teams,detail,open,note);render();return section;
}

document.getElementById('lol-refresh').addEventListener('click',loadMatches);</script></body></html>
