<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080e21"><title>Entrelia — Powered by Atlas</title><meta name="description" content="Entrelia: un universo digitale sta prendendo forma. Powered by Atlas."><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;color:#f5f6ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(ellipse at 25% 20%,#273b78 0%,transparent 42%),radial-gradient(ellipse at 85% 80%,#35205a 0%,transparent 45%),#080e21}main{text-align:center;padding:3rem 1.5rem;max-width:780px}h1{font-size:clamp(3.8rem,12vw,7rem);letter-spacing:.14em;font-weight:650;margin:0}p{font-size:clamp(1.15rem,3vw,1.6rem);line-height:1.6;color:#d8dff8}.sub{font-size:.9rem;letter-spacing:.35em;text-transform:uppercase;color:#aebef5}.star{font-size:2rem;color:#a8b9ff;margin-bottom:1.5rem}footer{margin-top:4rem;color:#9daacf;font-size:.85rem}.action{display:inline-flex;align-items:center;justify-content:center;margin-top:1.6rem;padding:.85rem 1.6rem;border:1px solid #8da7ff;border-radius:12px;background:#192a57;color:#f5f6ff;font:inherit;font-weight:650;letter-spacing:.06em;cursor:pointer;transition:background .2s,transform .2s}.action:hover{background:#304581;transform:translateY(-2px)}.action:focus-visible{outline:3px solid #d7e4ff;outline-offset:4px}[hidden]{display:none!important}.panel{margin-top:2.5rem;padding:2rem;border:1px solid #596ca5;border-radius:20px;background:#111b3bbb}.panel h2{font-size:clamp(1.6rem,5vw,2.4rem);margin:.4rem 0}.panel p{font-size:1rem}.module{display:block;width:100%;padding:1.25rem;margin-top:1.4rem;text-align:left;border-radius:14px;border:1px solid #7184bf;background:#1a2850;color:inherit;font:inherit;cursor:pointer}.module:hover{background:#253867}.module strong{display:block;font-size:1.25rem}.module span{display:block;font-size:.9rem;color:#c0cae8;margin-top:.5rem}.back{margin-top:1.4rem;border:0;background:transparent;color:#b8caff;text-decoration:underline;cursor:pointer;font:inherit}</style></head><body><main><div class="star" aria-hidden="true">✦</div><h1>ENTRELIA</h1><div class="sub">Powered by Atlas</div><p>Un universo digitale sta prendendo forma.</p><section id="welcome"><button class="action" id="enter" type="button">Enter Entrelia →</button></section><section id="hub" class="panel" hidden><h2>Esplora Entrelia</h2><p>Il nostro universo prende forma, un modulo alla volta.</p><button id="analyst" class="module" type="button"><strong>LoL Analyst →</strong><span>Uno spazio dedicato all'analisi delle partite di League of Legends.</span></button><button class="back" id="home-from-hub" type="button">← Torna alla pagina iniziale</button></section><section id="analyst-view" class="panel" hidden><h2>LoL Analyst</h2><p>Il primo modulo di Entrelia. L'interfaccia di analisi è in preparazione.</p><button class="back" id="back-to-hub" type="button">← Torna ai moduli</button></section><footer>Coming soon</footer></main><script>const welcome=document.getElementById('welcome'),hub=document.getElementById('hub'),analystView=document.getElementById('analyst-view');function show(view){welcome.hidden=view!=='welcome';hub.hidden=view!=='hub';analystView.hidden=view!=='analyst';}document.getElementById('enter').addEventListener('click',()=>show('hub'));document.getElementById('analyst').addEventListener('click',()=>show('analyst'));document.getElementById('home-from-hub').addEventListener('click',()=>show('welcome'));document.getElementById('back-to-hub').addEventListener('click',()=>show('hub'));</script></body></html>
